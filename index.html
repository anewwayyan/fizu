<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
	if (localStorage.getItem("theme") === "dark") {
		document.documentElement.setAttribute("data-theme", "dark");
	}
</script>

<title> Beo + fizu</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💸</text></svg>">

<style>
	:root {
		--bg: #f4f5f7;
		--card-bg: #ffffff;
		--text: #1a1a1a;
		--muted: #666;
		--accent: #2f8f4e;
	}

	html[data-theme="dark"] {
		--bg: #14161a;
		--card-bg: #1f2227;
		--text: #f2f2f2;
		--muted: #9a9a9a;
		--accent: #4ade80;
	}

	* {
		box-sizing: border-box;
	}

	body {
		margin: 0;
		min-height: 100vh;
		display: flex;
		align-items: center;
		justify-content: center;
		background: var(--bg);
		color: var(--text);
		font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
		transition: background 0.2s, color 0.2s;
	}

	.card {
		background: var(--card-bg);
		border-radius: 18px;
		padding: 2.5em 2em;
		max-width: 420px;
		width: 90%;
		text-align: center;
		box-shadow: 0 10px 30px rgba(0,0,0,0.12);
		position: relative;
	}

	h1 {
		margin: 0 0 0.2em 0;
		font-size: 1.4em;
	}

	#fizu-osszeg {
		font-size: 2.6em;
		font-weight: bold;
		color: var(--accent);
		margin: 0.3em 0 0.15em 0;
		font-variant-numeric: tabular-nums;
		transition: filter 0.2s ease;
	}

	#fizu-status {
		font-size: 1em;
		margin: 0.3em 0;
	}

	#fizu-varhato {
		font-size: 1em;
		font-weight: 600;
		margin: 0.8em 0;
		transition: filter 0.2s ease;
	}

	#fizu-osszeg,
	#fizu-varhato {
		will-change: filter;
		transform: translateZ(0);
	}

	.osszeg-elrejtve {
		filter: blur(9px);
		user-select: none;
	}

	#fizu-info {
		color: var(--muted);
		font-size: 0.85em;
		line-height: 1.6;
		margin-top: 1em;
	}

	.progress-container {
		width: 100%;
		height: 12px;
		background: var(--bg);
		border-radius: 10px;
		overflow: hidden;
		margin: 1em 0 1.5em 0;
	}

	#progress-bar {
		height: 100%;
		width: 0%;
		background: var(--accent);
		border-radius: 10px;
		transition: width 0.5s ease;
	}

	#muszak-naptar {
		margin-top: 1.5em;
		text-align: left;
	}

	.naptar-cim {
		text-align: center;
		font-weight: 600;
		margin-bottom: 0.8em;
	}

	.naptar-fejlec,
	.naptar-napok {
		display: grid;
		grid-template-columns: repeat(7, 1fr);
		gap: 4px;
	}

	.naptar-fejlec {
		font-size: 0.7em;
		color: var(--muted);
		text-align: center;
		margin-bottom: 4px;
	}

	.nap {
		min-height: 50px;
		border-radius: 9px;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		font-size: 0.78em;
		padding: 3px 1px;
		touch-action: manipulation;
	}

	.nap-ures {
		background: transparent;
	}

	.nap-nappal {
		background: rgba(47, 143, 78, 0.15);
	}

	.nap-ejszaka {
		background: rgba(100, 100, 100, 0.15);
	}

	.nap-szabad {
		background: var(--bg);
	}

	.nap-szabi {
		background: rgba(230, 126, 34, 0.18);
	}

	.nap-tsz {
		background: rgba(142, 68, 173, 0.16);
		box-shadow: inset 0 0 0 2px rgba(142, 68, 173, 0.55);
	}

	.nap-tsz .nap-jel {
		font-size: 1.05em;
		font-weight: 800;
		color: #8e44ad;
		letter-spacing: -0.5px;
	}

	.nap-tulora {
		box-shadow: inset 0 0 0 2px #e67e22;
	}

	.nap-szabi .nap-jel {
		font-size: 1.3em;
		font-weight: 800;
		color: #e67e22;
	}

	.nap-ma {
		outline: 2px solid var(--accent);
		font-weight: bold;
	}

	.nap-jel {
		font-size: 1.1em;
		line-height: 1;
		white-space: nowrap;
		display: flex;
		align-items: center;
		justify-content: center;
		min-width: 0;
	}

	.nap-szam {
		margin-top: 2px;
	}

	.theme-toggle,
	.privacy-toggle {
		position: absolute;
		top: 1em;
		background: none;
		border: 1px solid var(--muted);
		border-radius: 20px;
		color: var(--text);
		padding: 0.35em 0.7em;
		font-size: 0.8em;
		cursor: pointer;
		display: flex;
		align-items: center;
		justify-content: center;
	}

	.theme-toggle {
		right: 1em;
	}

	.privacy-toggle {
		left: 1em;
	}

	.privacy-toggle svg {
		width: 18px;
		height: 18px;
		display: block;
	}

	/* =========================
	   INTERAKTÍV MŰSZAKBEÁLLÍTÁS
	   ========================= */

	.nap {
		cursor: pointer;
		transition: transform 0.12s ease, box-shadow 0.12s ease;
	}

	.nap:hover {
		transform: translateY(-1px);
		box-shadow: 0 2px 8px rgba(0,0,0,0.10);
	}

	.muszak-modal-hatter {
		display: none;
		position: fixed;
		inset: 0;
		background: rgba(0,0,0,0.45);
		z-index: 1000;
		align-items: center;
		justify-content: center;
		padding: 1em;
	}

	.muszak-modal-hatter.lathato {
		display: flex;
	}

	.muszak-modal {
		width: min(360px, 100%);
		background: var(--card-bg);
		color: var(--text);
		border-radius: 18px;
		padding: 1.4em;
		box-shadow: 0 15px 50px rgba(0,0,0,0.25);
		text-align: left;
	}

	.muszak-modal h2 {
		margin: 0 0 0.25em 0;
		font-size: 1.15em;
	}

	.muszak-modal-datum {
		color: var(--muted);
		font-size: 0.9em;
		margin-bottom: 1em;
	}

	.muszak-opciok {
		display: grid;
		gap: 0.55em;
	}

	.muszak-opcio {
		width: 100%;
		border: 1px solid rgba(128,128,128,0.35);
		border-radius: 10px;
		padding: 0.75em 0.9em;
		background: var(--bg);
		color: var(--text);
		font-size: 0.95em;
		text-align: left;
		cursor: pointer;
	}

	.muszak-opcio:hover {
		border-color: var(--accent);
	}

	.muszak-opcio.torles {
		color: #c0392b;
	}

	.muszak-modal-bezar {
		margin-top: 0.8em;
		width: 100%;
		border: 0;
		background: transparent;
		color: var(--muted);
		padding: 0.6em;
		cursor: pointer;
	}

	.naptar-segitseg {
		text-align: center;
		color: var(--muted);
		font-size: 0.75em;
		margin-top: 0.7em;
	}


	.nap-tulora .nap-jel {
		font-size: 1em;
		letter-spacing: -1px;
	}

	@media (max-width: 520px) {

		body {
			align-items: flex-start;
			padding: 12px 0;
		}

		.card {
			width: 96%;
			max-width: 440px;
			padding: 2.3em 0.9em 1.6em;
		}

		.naptar-fejlec,
		.naptar-napok {
			gap: 5px;
		}

		.nap {
			min-height: 54px;
			border-radius: 10px;
			font-size: 0.8em;
			padding: 4px 1px;
		}

		.nap-jel {
			font-size: 1.15em;
		}

		.nap-tulora .nap-jel {
			font-size: 0.95em;
			letter-spacing: -2px;
		}

		.nap-szam {
			margin-top: 4px;
		}
	}


	.naptar-cim-sor {
		display: grid;
		grid-template-columns: 42px 1fr 42px;
		align-items: center;
		gap: 6px;
		margin-bottom: 0.8em;
	}

	.naptar-cim {
		text-align: center;
		font-weight: 600;
		margin-bottom: 0;
	}

	.naptar-nav {
		border: 1px solid rgba(128,128,128,0.35);
		background: var(--bg);
		color: var(--text);
		border-radius: 10px;
		height: 38px;
		font-size: 1.25em;
		line-height: 1;
		cursor: pointer;
		display: flex;
		align-items: center;
		justify-content: center;
		touch-action: manipulation;
	}

	.naptar-nav:hover {
		border-color: var(--accent);
	}

	@media (max-width: 520px) {
		.naptar-cim-sor {
			grid-template-columns: 46px 1fr 46px;
		}

		.naptar-nav {
			height: 42px;
			font-size: 1.35em;
		}
	}


	/* =========================
	   NAPTÁRBEJEGYZÉSEK
	   ========================= */

	.nap {
		position: relative;
	}

	.naptar-pont {
		position: absolute;
		top: 5px;
		right: 5px;
		width: 8px;
		height: 8px;
		border-radius: 50%;
		background: #e53935;
		box-shadow: 0 0 0 2px var(--card-bg);
	}

	.naptar-bejegyzes-gomb {
		width: 100%;
		margin-top: 0.7em;
		border: 1px solid rgba(128,128,128,0.35);
		border-radius: 10px;
		padding: 0.75em 0.9em;
		background: var(--bg);
		color: var(--text);
		font-size: 0.95em;
		text-align: left;
		cursor: pointer;
	}

	.naptar-bejegyzes-gomb:hover {
		border-color: var(--accent);
	}

	.naptar-modal-hatter {
		display: none;
		position: fixed;
		inset: 0;
		background: rgba(0,0,0,0.45);
		z-index: 1100;
		align-items: center;
		justify-content: center;
		padding: 1em;
	}

	.naptar-modal-hatter.lathato {
		display: flex;
	}

	.naptar-modal {
		width: min(380px, 100%);
		background: var(--card-bg);
		color: var(--text);
		border-radius: 18px;
		padding: 1.4em;
		box-shadow: 0 15px 50px rgba(0,0,0,0.25);
		text-align: left;
	}

	.naptar-modal h2 {
		margin: 0 0 0.25em 0;
		font-size: 1.15em;
	}

	.naptar-modal-datum {
		color: var(--muted);
		font-size: 0.9em;
		margin-bottom: 1em;
	}

	.naptar-mezo {
		margin-bottom: 0.9em;
	}

	.naptar-mezo label {
		display: block;
		font-size: 0.82em;
		font-weight: 600;
		margin-bottom: 0.35em;
	}

	.naptar-mezo input,
	.naptar-mezo textarea {
		width: 100%;
		border: 1px solid rgba(128,128,128,0.35);
		border-radius: 10px;
		padding: 0.75em;
		background: var(--bg);
		color: var(--text);
		font: inherit;
	}

	.naptar-mezo textarea {
		min-height: 90px;
		resize: vertical;
	}

	.naptar-modal-gombok {
		display: grid;
		gap: 0.55em;
	}

	.naptar-mentes,
	.naptar-torles,
	.naptar-megse {
		width: 100%;
		border-radius: 10px;
		padding: 0.75em 0.9em;
		font-size: 0.95em;
		cursor: pointer;
	}

	.naptar-mentes {
		border: 0;
		background: var(--accent);
		color: white;
		font-weight: 700;
	}

	.naptar-torles {
		border: 1px solid rgba(192,57,43,0.5);
		background: transparent;
		color: #c0392b;
	}

	.naptar-megse {
		border: 0;
		background: transparent;
		color: var(--muted);
	}

	.naptar-torles[hidden] {
		display: none;
	}

	@media (max-width: 520px) {
		.naptar-pont {
			top: 4px;
			right: 4px;
			width: 9px;
			height: 9px;
		}
	}


	/* =========================
	   BEJELENTKEZÉS / OWNER MÓD
	   ========================= */

	.auth-box {
		display: flex;
		align-items: center;
		justify-content: center;
		gap: 0.45em;
		margin: 0.2em 0 0.45em 0;
		z-index: 20;
	}

	.auth-btn {
		border: 1px solid var(--muted);
		border-radius: 20px;
		background: var(--card-bg);
		color: var(--text);
		padding: 0.4em 0.75em;
		font-size: 0.78em;
		cursor: pointer;
		text-decoration: none;
		display: inline-flex;
		align-items: center;
		gap: 0.35em;
		white-space: nowrap;
	}

	.auth-btn:hover {
		border-color: var(--accent);
	}

	.auth-status {
		font-size: 0.75em;
		color: var(--muted);
		white-space: nowrap;
	}

	.auth-dot {
		width: 8px;
		height: 8px;
		border-radius: 50%;
		background: var(--accent);
		display: inline-block;
	}

	@media (max-width: 520px) {
		.auth-box {
			justify-content: center;
			margin: 0.15em 0 0.5em 0;
		}

		.auth-btn {
			font-size: 0.8em;
		}
	}


	.auth-profile-icon {
		width: 16px;
		height: 16px;
		display: inline-block;
		flex: 0 0 auto;
	}

	.auth-profile-icon svg {
		width: 100%;
		height: 100%;
		display: block;
	}


</style>
</head>

<body>

<div class="card">

	<button class="privacy-toggle" id="privacy-btn" onclick="toggleOsszegLathatosag()" title="Összeg megjelenítése"></button>

	<button class="theme-toggle" onclick="toggleTheme()">🌙</button>

	<div class="auth-box" id="auth-box">
		<a class="auth-btn" id="auth-login-btn" href="/.auth/login/aad">Microsoft belépés</a>

		<div id="auth-logged-in" style="display:none; align-items:center; gap:0.45em;">
			<span class="auth-status" style="display:inline-flex; align-items:center; gap:0.35em;">
				<span class="auth-profile-icon" aria-hidden="true">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<circle cx="12" cy="8" r="4"></circle>
						<path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"></path>
					</svg>
				</span>
				Belépve
			</span>
			<a class="auth-btn" href="/.auth/logout">Kilépés</a>
		</div>
	</div>


	<p id="fizu-osszeg">0 Ft</p>

	<p id="fizu-status"></p>

	<p id="fizu-varhato"></p>

	<div class="progress-container">
		<div id="progress-bar"></div>
	</div>

	<div id="muszak-naptar"></div>

	<p id="fizu-info"></p>

</div>

<script>

	function toggleTheme() {

		const root = document.documentElement;
		const dark = root.getAttribute("data-theme") === "dark";

		if (dark) {
			root.removeAttribute("data-theme");
			localStorage.setItem("theme", "light");
		} else {
			root.setAttribute("data-theme", "dark");
			localStorage.setItem("theme", "dark");
		}
	}


	/* =========================
	   ÖSSZEG ELREJTÉSE (adatvédelem)
	   ========================= */

	const SZEM_IKON =
		'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';

	const ATHUZOTT_SZEM_IKON =
		'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.8 21.8 0 0 1 5.06-6.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.8 21.8 0 0 1-3.22 4.53M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';

	// Alapértelmezetten el van rejtve az összeg
	let osszegRejtve = true;

	function frissitPrivacyGomb() {

		const btn = document.getElementById("privacy-btn");

		const celok = [
			document.getElementById("fizu-osszeg"),
			document.getElementById("fizu-varhato")
		];

		celok.forEach(function (el) {
			if (osszegRejtve) {
				el.classList.add("osszeg-elrejtve");
			} else {
				el.classList.remove("osszeg-elrejtve");
			}
		});

		btn.innerHTML = osszegRejtve ? ATHUZOTT_SZEM_IKON : SZEM_IKON;

		if (!isOwner) {
			btn.title = "Az összeg megjelenítéséhez ownerként kell bejelentkezni";
			btn.style.opacity = "0.55";
			btn.style.cursor = "not-allowed";
		} else {
			btn.title = osszegRejtve ? "Összeg megjelenítése" : "Összeg elrejtése";
			btn.style.opacity = "1";
			btn.style.cursor = "pointer";
		}
	}

	function toggleOsszegLathatosag() {

		if (!isOwner) {
			osszegRejtve = true;
			frissitPrivacyGomb();
			return;
		}

		osszegRejtve = !osszegRejtve;
		frissitPrivacyGomb();
	}


	/* =========================
	   BEÁLLÍTÁSOK
	   ========================= */

	const ORABER = 2750;

	/*
	   2026. szeptember 8. = nappalos
	   Ciklus:
	   1. nappal
	   2. éjszaka
	   3. szabad
	   4. szabad
	*/

	const HORGONY = new Date(2026, 8, 8);
	HORGONY.setHours(0, 0, 0, 0);


	/* =========================
	   MŰSZAK TÍPUSA
	   ========================= */

	function muszakTipus(nap) {

	const napKezdet = new Date(
		nap.getFullYear(),
		nap.getMonth(),
		nap.getDate()
	);

	// Felhasználói módosítás elsőbbséget élvez.
	const datumKulcs =
		napKezdet.getFullYear() + "-" +
		String(napKezdet.getMonth() + 1).padStart(2, "0") + "-" +
		String(napKezdet.getDate()).padStart(2, "0");

	if (muszakModositasok[datumKulcs]) {
		return muszakModositasok[datumKulcs];
	}

	const napokKulonbseg =
		Math.round((napKezdet - HORGONY) / 86400000);

	const ciklusIndex =
		((napokKulonbseg % 4) + 4) % 4;

	if (ciklusIndex === 0) {
		return "nappal";
	}

	if (ciklusIndex === 1) {
		return "ejszaka";
	}

	return "szabad";
}


	/* =========================
	   MŰSZAK IDŐINTERVALLUM
	   ========================= */

	function muszakIdointervallum(nap) {

		const tipus = muszakTipus(nap);

		const ev = nap.getFullYear();
		const honap = nap.getMonth();
		const napSzam = nap.getDate();

		if (tipus === "nappal" || tipus === "nappal_tulora") {

			return [
				new Date(ev, honap, napSzam, 7, 0, 0),
				new Date(ev, honap, napSzam, 19, 0, 0)
			];
		}

		if (
			tipus === "ejszaka" ||
			tipus === "ejszaka_tulora"
		) {

			return [
				new Date(ev, honap, napSzam, 19, 0, 0),
				new Date(ev, honap, napSzam + 1, 7, 0, 0)
			];
		}

		return null;
	}


	/* =========================
	   BÉRSZORZÓ MŰSZAKTÍPUSONKÉNT
	   ========================= */

	// nappal / éjszaka: normál 100%
	// nappal_tulora: beosztás szerinti pihenőnapon (P) végzett munka
	//                -> Mt. 143. § alapján +100% pótlék, azaz 200% (dupla fizu)
	function muszakSzorzo(tipus) {

		if (
			tipus === "nappal_tulora" ||
			tipus === "ejszaka_tulora"
		) {
			return 2;
		}

		return 1;
	}


	/* =========================
	   LEDOLGOZOTT ÓRÁK ÉS PÉNZ
	   ========================= */

	function idoszakOsszesites(tol, ig) {

		let osszOraMs = 0;
		let osszPenz = 0;

		const kezdoNap = new Date(
			tol.getFullYear(),
			tol.getMonth(),
			tol.getDate() - 1
		);

		const utolsoNap = new Date(
			ig.getFullYear(),
			ig.getMonth(),
			ig.getDate()
		);

		for (
			let d = new Date(kezdoNap);
			d <= utolsoNap;
			d.setDate(d.getDate() + 1)
		) {

			const tipus =
				muszakTipus(d);

			const intervallum =
				muszakIdointervallum(d);

			if (!intervallum) {
				continue;
			}

			const [ms, me] = intervallum;

			const metszetKezdet =
				ms > tol ? ms : tol;

			const metszetVeg =
				me < ig ? me : ig;

			if (metszetVeg > metszetKezdet) {

				const oraMs =
					metszetVeg - metszetKezdet;

				const ora =
					oraMs / 3600000;

				osszOraMs += oraMs;

				osszPenz +=
					ora * ORABER * muszakSzorzo(tipus);
			}
		}

		return {
			orak: osszOraMs / 3600000,
			penz: osszPenz
		};
	}


	/* =========================
	   FORMÁZÁS
	   ========================= */

	function formatFt(szam) {

		return Math.round(szam)
			.toLocaleString("hu-HU") + " Ft";
	}


	function formatDatum(d) {

		return d.getFullYear() + ". " +
			String(d.getMonth() + 1).padStart(2, "0") + ". " +
			String(d.getDate()).padStart(2, "0") + ".";
	}


	/* =========================
	   FIZU FRISSÍTÉSE
	   ========================= */

	function frissitFizu() {

		const most = new Date();


		/* Aktuális hónap első napja */

		const honapKezdete = new Date(
			most.getFullYear(),
			most.getMonth(),
			1,
			0, 0, 0
		);


		/* Aktuális hónap utolsó napja */

		const honapVege = new Date(
			most.getFullYear(),
			most.getMonth() + 1,
			0,
			23, 59, 59
		);


		/* 
		   Következő fizetés:

		   Ha még nincs 8-a:
		   aktuális hónap 8.

		   Ha már elmúlt 8-a:
		   következő hónap 8.
		*/

		const fizetesHonap =
			most.getDate() < 8
				? most.getMonth()
				: most.getMonth() + 1;

		const fizetesEv =
			most.getFullYear() +
			(
				fizetesHonap > 11
					? 1
					: 0
			);

		const kovetkezo = new Date(
			fizetesEv,
			fizetesHonap % 12,
			8,
			0, 0, 0
		);


		/* Eddig megkeresett pénz */

		const eddig =
			idoszakOsszesites(honapKezdete, most);

		const eddigOsszeg =
			eddig.penz;

		document.getElementById("fizu-osszeg")
			.textContent = formatFt(eddigOsszeg);


		/* Teljes havi várható fizetés */

		const havi =
			idoszakOsszesites(
				honapKezdete,
				honapVege
			);

		const haviOrak =
			havi.orak;

		const haviOsszeg =
			havi.penz;

		document.getElementById("fizu-varhato")
			.textContent =
				"💰 Várható fizetés 8-án: ~" +
				formatFt(haviOsszeg) +
				" (" + haviOrak + " óra)";


		/* Progress bar */

		const progress =
			haviOsszeg > 0
				? Math.min(
					(eddigOsszeg / haviOsszeg) * 100,
					100
				)
				: 0;

		document.getElementById("progress-bar")
			.style.width = progress + "%";


		/* Aktuális műszak állapota */

		let aktivTipus = null;
		let aktivIntervallum = null;

		/*
		   Éjszakás műszak átnyúlik a következő napra.
		   Ezért először a tegnap kezdődött műszakot nézzük meg.
		*/

		const tegnap = new Date(
			most.getFullYear(),
			most.getMonth(),
			most.getDate() - 1
		);

		const tegnapiIntervallum =
			muszakIdointervallum(tegnap);

		if (tegnapiIntervallum) {

			const [tegnapKezdet, tegnapVeg] =
				tegnapiIntervallum;

			if (
				most >= tegnapKezdet &&
				most <= tegnapVeg
			) {
				aktivTipus = muszakTipus(tegnap);
				aktivIntervallum = tegnapiIntervallum;
			}
		}

		/*
		   Ha nem tart még a tegnapi műszak,
		   akkor megnézzük a mai nap műszakját.
		*/

		if (!aktivIntervallum) {

			const maiIntervallum =
				muszakIdointervallum(most);

			if (maiIntervallum) {

				const [maiKezdet, maiVeg] =
					maiIntervallum;

				if (
					most >= maiKezdet &&
					most <= maiVeg
				) {
					aktivTipus = muszakTipus(most);
					aktivIntervallum = maiIntervallum;
				}
			}
		}

		let statusSzoveg;

		if (aktivIntervallum) {

			let muszakNev;

			if (aktivTipus === "nappal") {

				muszakNev =
					"🌞 Nappalos műszak";

			} else if (aktivTipus === "nappal_tulora") {

				muszakNev =
					"🌞⚡ Nappalos műszak (túlóra, 200%)";

			} else if (aktivTipus === "ejszaka_tulora") {

				muszakNev =
					"🌙⚡ Éjszakás műszak (túlóra, 200%)";

			} else {

				muszakNev =
					"🌙 Éjszakás műszak";
			}

			statusSzoveg =
				muszakNev +
				" – megy a számláló!";

		} else {

			const maiTipus =
				muszakTipus(most);

			if (maiTipus === "szabad") {

				statusSzoveg =
					"😴 Ma szabadnap van, a számláló most nem nő.";

			} else if (maiTipus === "szabi") {

				statusSzoveg =
					"🅂 Szabin vagy, a számláló most nem nő.";

			} else if (maiTipus === "tsz") {

				statusSzoveg =
					"TSZ Többlet szabadság – ma nem dolgozol, erre a napra nem jár bér.";

			} else {

				statusSzoveg =
					"⏸️ Most nincs műszak, a számláló szünetel.";
			}
		}


		document.getElementById("fizu-status")
			.textContent = statusSzoveg;


		/* Napok a következő fizetésig */

		const napokAFizuig =
			Math.ceil(
				(kovetkezo - most) / 86400000
			);


		/* Alsó információs sor */

		document.getElementById("fizu-info")
			.textContent =
				"Időszak: " +
				formatDatum(honapKezdete) +
				" – " +
				formatDatum(honapVege) +
				" · Következő fizetés: " +
				formatDatum(kovetkezo) +
				" (" +
				napokAFizuig +
				" nap múlva)";
	}


	/* =========================
	   MŰSZAKNAPTÁR
	   ========================= */

	let naptarHonapEltolas = 0;

	function naptarHonapotValt(irany) {
		naptarHonapEltolas += irany;
		generalMuszakNaptar();
	}

	function generalMuszakNaptar() {

		const most = new Date();

		const megjelenitettHonap =
			new Date(
				most.getFullYear(),
				most.getMonth() + naptarHonapEltolas,
				1
			);

		const ev = megjelenitettHonap.getFullYear();
		const honap = megjelenitettHonap.getMonth();


		const honapNeve =
			new Intl.DateTimeFormat("hu-HU", {
				month: "long"
			}).format(
				new Date(ev, honap, 1)
			);


		const napokSzama =
			new Date(
				ev,
				honap + 1,
				0
			).getDate();


		const elsoNap =
			new Date(
				ev,
				honap,
				1
			).getDay();


		/* Hétfő legyen az első nap */

		const eltolodas =
			(elsoNap + 6) % 7;


		let html = `

			<div class="naptar-cim-sor">

				<button
					class="naptar-nav"
					onclick="naptarHonapotValt(-1)"
					aria-label="Előző hónap"
					title="Előző hónap"
				>‹</button>

				<div class="naptar-cim">
					${ev}. ${honapNeve}
				</div>

				<button
					class="naptar-nav"
					onclick="naptarHonapotValt(1)"
					aria-label="Következő hónap"
					title="Következő hónap"
				>›</button>

			</div>

			<div class="naptar-fejlec">

				<div>H</div>
				<div>K</div>
				<div>Sze</div>
				<div>Cs</div>
				<div>P</div>
				<div>Szo</div>
				<div>V</div>

			</div>

			<div class="naptar-napok">

		`;


		/* Üres mezők a hónap elején */

		for (
			let i = 0;
			i < eltolodas;
			i++
		) {

			html +=
				`<div class="nap nap-ures"></div>`;
		}


		/* Napok */

		for (
			let nap = 1;
			nap <= napokSzama;
			nap++
		) {

			const datum =
				new Date(
					ev,
					honap,
					nap
				);

			const tipus =
				muszakTipus(datum);


			let osztaly = "nap ";
			let jel = "";


			if (tipus === "nappal") {

				osztaly += "nap-nappal";
				jel = "🌞";

			} else if (tipus === "nappal_tulora") {

				osztaly += "nap-nappal nap-tulora";
				jel = "🌞⚡";

			} else if (
				tipus === "ejszaka" ||
				tipus === "ejszaka_tulora"
			) {

				osztaly += "nap-ejszaka";

				if (tipus === "ejszaka_tulora") {
					osztaly += " nap-tulora";
					jel = "🌙⚡";
				} else {
					jel = "🌙";
				}

			} else if (tipus === "szabi") {

				osztaly += "nap-szabi";
				jel = "SZ";

			} else if (tipus === "tsz") {

				osztaly += "nap-tsz";
				jel = "TSZ";

			} else {

				osztaly += "nap-szabad";
				jel = "😴";
			}


			/* Mai nap kiemelése */

			const ma =
				nap === most.getDate() &&
				honap === most.getMonth() &&
				ev === most.getFullYear();


			if (ma) {
				osztaly += " nap-ma";
			}


			const kulcs = datumKulcs(ev, honap, nap);
			const vanBejegyzes = !!naptarBejegyzesek[kulcs];

			const pontHtml =
				vanBejegyzes
					? `<span class="naptar-pont" title="Van naptárbejegyzés"></span>`
					: "";

			html += `

				<div class="${osztaly}"
					onclick="muszakModalMegnyit(${ev}, ${honap}, ${nap})"
					title="Kattints a nap beállításaihoz">

					${pontHtml}

					<div class="nap-jel">
						${jel}
					</div>

					<div class="nap-szam">
						${nap}
					</div>

				</div>

			`;
		}


		html += `</div>`;


		document.getElementById(
			"muszak-naptar"
		).innerHTML = html;
	}




	/* =========================
	   AUTH / OWNER ELLENŐRZÉS
	   ========================= */

	let isOwner = false;
	let bejelentkezve = false;

	async function authAllapotBetoltese() {

		try {

			const response = await fetch("/.auth/me", {
				headers: {
					"Accept": "application/json"
				}
			});

			if (!response.ok) {
				throw new Error("HTTP " + response.status);
			}

			const adat = await response.json();
			const principal = adat.clientPrincipal;

			if (principal) {

				bejelentkezve = true;

				const szerepkorok =
					Array.isArray(principal.userRoles)
						? principal.userRoles
						: [];

				isOwner = szerepkorok.includes("owner");

			} else {

				bejelentkezve = false;
				isOwner = false;
			}

		} catch (error) {

			console.error(
				"Nem sikerült lekérni a bejelentkezési állapotot:",
				error
			);

			bejelentkezve = false;
			isOwner = false;
		}

		frissitAuthFelulet();
	}

	function frissitAuthFelulet() {

		const loginBtn =
			document.getElementById("auth-login-btn");

		const loggedIn =
			document.getElementById("auth-logged-in");

		if (bejelentkezve) {
			loginBtn.style.display = "none";
			loggedIn.style.display = "flex";
		} else {
			loginBtn.style.display = "inline-flex";
			loggedIn.style.display = "none";
		}

		if (!isOwner) {
			osszegRejtve = true;
		}

		frissitPrivacyGomb();
	}

	function frissitSzerkesztesJog() {

		const ownerResz =
			document.getElementById("owner-szerkesztes");

		const nemOwnerUzenet =
			document.getElementById("nem-owner-uzenet");

		if (!ownerResz || !nemOwnerUzenet) {
			return;
		}

		if (isOwner) {
			ownerResz.style.display = "block";
			nemOwnerUzenet.style.display = "none";
		} else {
			ownerResz.style.display = "none";
			nemOwnerUzenet.style.display = "block";
		}
	}

	/* =========================
	   INTERAKTÍV MŰSZAKMENÜ
	   AZURE API SZINKRONNAL
	   ========================= */

	let kivalasztottDatum = null;

	// A szerverről betöltött módosítások ideiglenes memóriája.
	let muszakModositasok = {};

	function datumKulcs(ev, honap, nap) {
		return ev + "-" +
			String(honap + 1).padStart(2, "0") + "-" +
			String(nap).padStart(2, "0");
	}

	async function muszakModositasokBetoltese() {

		try {

			const response = await fetch("/api/muszakok", {
				method: "GET",
				headers: {
					"Accept": "application/json"
				}
			});

			if (!response.ok) {
				throw new Error("HTTP " + response.status);
			}

			muszakModositasok = await response.json();

			frissitFizu();
			generalMuszakNaptar();

		} catch (error) {

			console.error(
				"Nem sikerült betölteni a műszakmódosításokat:",
				error
			);

			muszakModositasok = {};

			frissitFizu();
			generalMuszakNaptar();
		}
	}

	function muszakModalMegnyit(ev, honap, nap) {

		kivalasztottDatum = datumKulcs(ev, honap, nap);

		const datum = new Date(ev, honap, nap);

		document.getElementById("muszak-modal-cim").textContent =
			"Műszak módosítása";

		document.getElementById("muszak-modal-datum").textContent =
			formatDatum(datum);

		frissitSzerkesztesJog();

		document.getElementById("muszak-modal-hatter")
			.classList.add("lathato");
	}

	function muszakModalBezar() {
		kivalasztottDatum = null;

		document.getElementById("muszak-modal-hatter")
			.classList.remove("lathato");
	}

	function modalHatterKattintas(event) {
		if (event.target.id === "muszak-modal-hatter") {
			muszakModalBezar();
		}
	}

	async function muszakBeallit(tipus) {

		if (!isOwner) {
			alert("A műszakok szerkesztéséhez ownerként kell bejelentkezned.");
			return;
		}

		if (!kivalasztottDatum) {
			return;
		}

		const datum = kivalasztottDatum;

		try {

			const response = await fetch("/api/muszakok", {
				method: "POST",
				headers: {
					"Content-Type": "application/json",
					"Accept": "application/json"
				},
				body: JSON.stringify({
					datum: datum,
					tipus: tipus
				})
			});

			if (!response.ok) {

				let hibaSzoveg = "HTTP " + response.status;

				try {
					const hibaAdat = await response.json();

					if (hibaAdat.hiba) {
						hibaSzoveg = hibaAdat.hiba;
					}
				} catch (_) {}

				throw new Error(hibaSzoveg);
			}

			muszakModositasok[datum] = tipus;

			muszakModalBezar();

			frissitFizu();
			generalMuszakNaptar();

		} catch (error) {

			console.error(
				"Nem sikerült elmenteni a műszakot:",
				error
			);

			alert(
				"Nem sikerült elmenteni a módosítást az Azure-ba.\n\n" +
				error.message
			);
		}
	}

	async function muszakTorol() {

		if (!isOwner) {
			alert("A műszakok szerkesztéséhez ownerként kell bejelentkezned.");
			return;
		}

		if (!kivalasztottDatum) {
			return;
		}

		const datum = kivalasztottDatum;

		try {

			const response = await fetch(
				"/api/muszakok?datum=" +
					encodeURIComponent(datum),
				{
					method: "DELETE",
					headers: {
						"Accept": "application/json"
					}
				}
			);

			if (!response.ok) {

				let hibaSzoveg = "HTTP " + response.status;

				try {
					const hibaAdat = await response.json();

					if (hibaAdat.hiba) {
						hibaSzoveg = hibaAdat.hiba;
					}
				} catch (_) {}

				throw new Error(hibaSzoveg);
			}

			delete muszakModositasok[datum];

			muszakModalBezar();

			frissitFizu();
			generalMuszakNaptar();

		} catch (error) {

			console.error(
				"Nem sikerült törölni a műszakmódosítást:",
				error
			);

			alert(
				"Nem sikerült visszaállítani az alapbeosztást.\n\n" +
				error.message
			);
		}
	}


	/* =========================
	   NAPTÁRBEJEGYZÉSEK – AZURE API
	   ========================= */

	let naptarBejegyzesek = {};
	let kivalasztottNaptarDatum = null;

	async function naptarBejegyzesekBetoltese() {

		try {

			const response = await fetch("/api/naptar", {
				method: "GET",
				headers: {
					"Accept": "application/json"
				}
			});

			if (!response.ok) {
				throw new Error("HTTP " + response.status);
			}

			naptarBejegyzesek = await response.json();

			generalMuszakNaptar();

		} catch (error) {

			console.error(
				"Nem sikerült betölteni a naptárbejegyzéseket:",
				error
			);

			naptarBejegyzesek = {};
			generalMuszakNaptar();

		muszakModalBezar();

		kivalasztottNaptarDatum = null;

	async function naptarBejegyzesMent() {

		if (!isOwner) {
			alert("A naptár szerkesztéséhez ownerként kell bejelentkezned.");
			return;
		}

		if (!kivalasztottNaptarDatum) {
			return;
		}

		const datum = kivalasztottNaptarDatum;

		const cim =
			document.getElementById("naptar-cim-input")
				.value.trim();

		const ido =
			document.getElementById("naptar-ido-input")
				.value;

		const megjegyzes =
			document.getElementById("naptar-megjegyzes-input")
				.value.trim();

		if (!cim) {
			alert("Adj meg egy címet a bejegyzéshez.");
			return;
		}

		try {

			const response = await fetch("/api/naptar", {
				method: "POST",
				headers: {
					"Content-Type": "application/json",
					"Accept": "application/json"
				},
				body: JSON.stringify({
					datum: datum,
					cim: cim,
					ido: ido,
					megjegyzes: megjegyzes
				})
			});

			if (!response.ok) {

				let hibaSzoveg = "HTTP " + response.status;

				try {
					const hibaAdat = await response.json();

					if (hibaAdat.hiba) {
						hibaSzoveg = hibaAdat.hiba;
					}
				} catch (_) {}

				throw new Error(hibaSzoveg);
			}

			naptarBejegyzesek[datum] = {
				cim: cim,
				ido: ido,
				megjegyzes: megjegyzes
			};

			naptarModalBezar();
			generalMuszakNaptar();

		} catch (error) {

			console.error(
				"Nem sikerült elmenteni a naptárbejegyzést:",
				error
			);

			alert(
				"Nem sikerült elmenteni a naptárbejegyzést az Azure-ba.\n\n" +
				error.message
			);
		}
	}

	async function naptarBejegyzesTorol() {

		if (!isOwner) {
			alert("A naptár szerkesztéséhez ownerként kell bejelentkezned.");
			return;
		}

		if (!kivalasztottNaptarDatum) {
			return;
		}

		const datum = kivalasztottNaptarDatum;

		try {

			const response = await fetch(
				"/api/naptar?datum=" +
					encodeURIComponent(datum),
				{
					method: "DELETE",
					headers: {
						"Accept": "application/json"
					}
				}
			);

			if (!response.ok) {

				let hibaSzoveg = "HTTP " + response.status;

				try {
					const hibaAdat = await response.json();

					if (hibaAdat.hiba) {
						hibaSzoveg = hibaAdat.hiba;
					}
				} catch (_) {}

				throw new Error(hibaSzoveg);
			}

			delete naptarBejegyzesek[datum];

			naptarModalBezar();
			generalMuszakNaptar();

		} catch (error) {

			console.error(
				"Nem sikerült törölni a naptárbejegyzést:",
				error
			);

			alert(
				"Nem sikerült törölni a naptárbejegyzést.\n\n" +
				error.message
			);
		}
	}



	/* =========================
	   INDÍTÁS
	   ========================= */

	frissitFizu();

	generalMuszakNaptar();

	muszakModositasokBetoltese();

	naptarBejegyzesekBetoltese();

	authAllapotBetoltese();

	frissitPrivacyGomb();

	document.addEventListener("keydown", function(event) {
		if (event.key === "Escape") {
			muszakModalBezar();
			naptarModalBezar();
		}
	});

	setInterval(
		frissitFizu,
		1000
	);

</script>


	<div class="muszak-modal-hatter" id="muszak-modal-hatter" onclick="modalHatterKattintas(event)">
		<div class="muszak-modal" onclick="event.stopPropagation()">
			<h2 id="muszak-modal-cim">Műszak módosítása</h2>
			<div class="muszak-modal-datum" id="muszak-modal-datum"></div>

			<div id="owner-szerkesztes" style="display:none;">
			<div class="muszak-opciok">
				<button class="muszak-opcio" onclick="muszakBeallit('nappal')">🌞 Nappalos</button>
				<button class="muszak-opcio" onclick="muszakBeallit('ejszaka')">🌙 Éjszakás</button>
				<button class="muszak-opcio" onclick="muszakBeallit('szabad')">😴 Szabadnap</button>
				<button class="muszak-opcio" onclick="muszakBeallit('szabi')">🅂 Szabadság</button>
				<button class="muszak-opcio" onclick="muszakBeallit('tsz')">TSZ Többlet szabadság (0 Ft)</button>
				<button class="muszak-opcio" onclick="muszakBeallit('nappal_tulora')">🌞⚡ Nappal + túlóra (200%)</button>
				<button class="muszak-opcio" onclick="muszakBeallit('ejszaka_tulora')">🌙⚡ Éjszaka + túlóra (200%)</button>
				<button class="muszak-opcio torles" onclick="muszakTorol()">↩ Alapbeosztás visszaállítása</button>
			</div>

			<button class="naptar-bejegyzes-gomb" onclick="naptarModalMegnyitKivalasztottNapra()">🔴 Naptárbejegyzés</button>
			</div>

			<div id="nem-owner-uzenet" style="display:none; color:var(--muted); font-size:0.9em; line-height:1.5; margin-top:0.8em;">
				A naptár megtekinthető, de szerkeszteni csak bejelentkezett ownerként lehet.
			</div>

			<button class="muszak-modal-bezar" onclick="muszakModalBezar()">Mégsem</button>
		</div>
	</div>


	<div class="naptar-modal-hatter" id="naptar-modal-hatter" onclick="naptarModalHatterKattintas(event)">
		<div class="naptar-modal" onclick="event.stopPropagation()">
			<h2>Naptárbejegyzés</h2>
			<div class="naptar-modal-datum" id="naptar-modal-datum"></div>

			<div class="naptar-mezo">
				<label for="naptar-cim-input">Cím</label>
				<input
					id="naptar-cim-input"
					type="text"
					placeholder="pl. Orvosi vizsgálat"
					autocomplete="off"
				>
			</div>

			<div class="naptar-mezo">
				<label for="naptar-ido-input">Időpont (nem kötelező)</label>
				<input
					id="naptar-ido-input"
					type="time"
				>
			</div>

			<div class="naptar-mezo">
				<label for="naptar-megjegyzes-input">Megjegyzés (nem kötelező)</label>
				<textarea
					id="naptar-megjegyzes-input"
					placeholder="pl. Üzemorvos, vigyem a leleteket"
				></textarea>
			</div>

			<div class="naptar-modal-gombok">
				<button class="naptar-mentes" onclick="naptarBejegyzesMent()">Mentés</button>
				<button class="naptar-torles" id="naptar-torles-gomb" onclick="naptarBejegyzesTorol()" hidden>Bejegyzés törlése</button>
				<button class="naptar-megse" onclick="naptarModalBezar()">Mégsem</button>
			</div>
		</div>
	</div>



</body>
