<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
	if (localStorage.getItem("theme") === "dark") {
		document.documentElement.setAttribute("data-theme", "dark");
	}
</script>

<title>Mennyi most a fizum? 💸</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💸</text></svg>">

<style>
	:root {
		--bg: #f4f5f7;
		--card-bg: #ffffff;
		--text: #1a1a1a;
		--muted: #666;
		--accent: #2f8f4e;
	}

	html[data-theme="dark"] {
		--bg: #14161a;
		--card-bg: #1f2227;
		--text: #f2f2f2;
		--muted: #9a9a9a;
		--accent: #4ade80;
	}

	* {
		box-sizing: border-box;
	}

	body {
		margin: 0;
		min-height: 100vh;
		display: flex;
		align-items: center;
		justify-content: center;
		background: var(--bg);
		color: var(--text);
		font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
		transition: background 0.2s, color 0.2s;
	}

	.card {
		background: var(--card-bg);
		border-radius: 18px;
		padding: 2.5em 2em;
		max-width: 420px;
		width: 90%;
		text-align: center;
		box-shadow: 0 10px 30px rgba(0,0,0,0.12);
		position: relative;
	}

	h1 {
		margin: 0 0 0.2em 0;
		font-size: 1.4em;
	}

	#fizu-osszeg {
		font-size: 2.6em;
		font-weight: bold;
		color: var(--accent);
		margin: 0.3em 0 0.15em 0;
		font-variant-numeric: tabular-nums;
	}

	#fizu-status {
		font-size: 1em;
		margin: 0.3em 0;
	}

	#fizu-varhato {
		font-size: 1em;
		font-weight: 600;
		margin: 0.8em 0;
	}

	#fizu-info {
		color: var(--muted);
		font-size: 0.85em;
		line-height: 1.6;
		margin-top: 1em;
	}

	.progress-container {
		width: 100%;
		height: 12px;
		background: var(--bg);
		border-radius: 10px;
		overflow: hidden;
		margin: 1em 0 1.5em 0;
	}

	#progress-bar {
		height: 100%;
		width: 0%;
		background: var(--accent);
		border-radius: 10px;
		transition: width 0.5s ease;
	}

	#muszak-naptar {
		margin-top: 1.5em;
		text-align: left;
	}

	.naptar-cim {
		text-align: center;
		font-weight: 600;
		margin-bottom: 0.8em;
	}

	.naptar-fejlec,
	.naptar-napok {
		display: grid;
		grid-template-columns: repeat(7, 1fr);
		gap: 4px;
	}

	.naptar-fejlec {
		font-size: 0.7em;
		color: var(--muted);
		text-align: center;
		margin-bottom: 4px;
	}

	.nap {
		min-height: 42px;
		border-radius: 8px;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		font-size: 0.75em;
	}

	.nap-ures {
		background: transparent;
	}

	.nap-nappal {
		background: rgba(47, 143, 78, 0.15);
	}

	.nap-ejszaka {
		background: rgba(100, 100, 100, 0.15);
	}

	.nap-szabad {
		background: var(--bg);
	}

	.nap-ma {
		outline: 2px solid var(--accent);
		font-weight: bold;
	}

	.nap-jel {
		font-size: 1.1em;
		line-height: 1.1;
	}

	.nap-szam {
		margin-top: 2px;
	}

	.theme-toggle {
		position: absolute;
		top: 1em;
		right: 1em;
		background: none;
		border: 1px solid var(--muted);
		border-radius: 20px;
		color: var(--text);
		padding: 0.3em 0.8em;
		font-size: 0.8em;
		cursor: pointer;
	}
</style>
</head>

<body>

<div class="card">

	<button class="theme-toggle" onclick="toggleTheme()">🌙</button>

	<h1>Mennyi most a fizum? 💸</h1>

	<p id="fizu-osszeg">0 Ft</p>

	<p id="fizu-status"></p>

	<p id="fizu-varhato"></p>

	<div class="progress-container">
		<div id="progress-bar"></div>
	</div>

	<div id="muszak-naptar"></div>

	<p id="fizu-info"></p>

</div>

<script>

	function toggleTheme() {

		const root = document.documentElement;
		const dark = root.getAttribute("data-theme") === "dark";

		if (dark) {
			root.removeAttribute("data-theme");
			localStorage.setItem("theme", "light");
		} else {
			root.setAttribute("data-theme", "dark");
			localStorage.setItem("theme", "dark");
		}
	}


	/* =========================
	   BEÁLLÍTÁSOK
	   ========================= */

	const ORABER = 2750;

	/*
	   2026. szeptember 8. = nappalos
	   Ciklus:
	   1. nappal
	   2. éjszaka
	   3. szabad
	   4. szabad
	*/

	const HORGONY = new Date(2026, 8, 8);
	HORGONY.setHours(0, 0, 0, 0);


	/* =========================
	   MŰSZAK TÍPUSA
	   ========================= */

	function muszakTipus(nap) {

	const napKezdet = new Date(
		nap.getFullYear(),
		nap.getMonth(),
		nap.getDate()
	);

	// KIVÉTEL:
	// 2026. szeptember 20. nappal helyett éjszaka
	if (
		napKezdet.getFullYear() === 2026 &&
		napKezdet.getMonth() === 8 &&
		napKezdet.getDate() === 20
	) {
		return "ejszaka";
	}

	const napokKulonbseg =
		Math.round((napKezdet - HORGONY) / 86400000);

	const ciklusIndex =
		((napokKulonbseg % 4) + 4) % 4;

	if (ciklusIndex === 0) {
		return "nappal";
	}

	if (ciklusIndex === 1) {
		return "ejszaka";
	}

	return "szabad";
}


	/* =========================
	   MŰSZAK IDŐINTERVALLUM
	   ========================= */

	function muszakIdointervallum(nap) {

		const tipus = muszakTipus(nap);

		const ev = nap.getFullYear();
		const honap = nap.getMonth();
		const napSzam = nap.getDate();

		if (tipus === "nappal") {

			return [
				new Date(ev, honap, napSzam, 7, 0, 0),
				new Date(ev, honap, napSzam, 19, 0, 0)
			];
		}

		if (tipus === "ejszaka") {

			return [
				new Date(ev, honap, napSzam, 19, 0, 0),
				new Date(ev, honap, napSzam + 1, 7, 0, 0)
			];
		}

		return null;
	}


	/* =========================
	   LEDOLGOZOTT ÓRÁK
	   ========================= */

	function ledolgozottOrak(tol, ig) {

		let osszOraMs = 0;

		const kezdoNap = new Date(
			tol.getFullYear(),
			tol.getMonth(),
			tol.getDate() - 1
		);

		const utolsoNap = new Date(
			ig.getFullYear(),
			ig.getMonth(),
			ig.getDate()
		);

		for (
			let d = new Date(kezdoNap);
			d <= utolsoNap;
			d.setDate(d.getDate() + 1)
		) {

			const intervallum =
				muszakIdointervallum(d);

			if (!intervallum) {
				continue;
			}

			const [ms, me] = intervallum;

			const metszetKezdet =
				ms > tol ? ms : tol;

			const metszetVeg =
				me < ig ? me : ig;

			if (metszetVeg > metszetKezdet) {

				osszOraMs +=
					metszetVeg - metszetKezdet;
			}
		}

		return osszOraMs / 3600000;
	}


	/* =========================
	   FORMÁZÁS
	   ========================= */

	function formatFt(szam) {

		return Math.round(szam)
			.toLocaleString("hu-HU") + " Ft";
	}


	function formatDatum(d) {

		return d.getFullYear() + ". " +
			String(d.getMonth() + 1).padStart(2, "0") + ". " +
			String(d.getDate()).padStart(2, "0") + ".";
	}


	/* =========================
	   FIZU FRISSÍTÉSE
	   ========================= */

	function frissitFizumat() {

		const most = new Date();


		/* Aktuális hónap első napja */

		const honapKezdete = new Date(
			most.getFullYear(),
			most.getMonth(),
			1,
			0, 0, 0
		);


		/* Aktuális hónap utolsó napja */

		const honapVege = new Date(
			most.getFullYear(),
			most.getMonth() + 1,
			0,
			23, 59, 59
		);


		/* 
		   Következő fizetés:

		   Ha még nincs 8-a:
		   aktuális hónap 8.

		   Ha már elmúlt 8-a:
		   következő hónap 8.
		*/

		const fizetesHonap =
			most.getDate() < 8
				? most.getMonth()
				: most.getMonth() + 1;

		const fizetesEv =
			most.getFullYear() +
			(
				fizetesHonap > 11
					? 1
					: 0
			);

		const kovetkezo = new Date(
			fizetesEv,
			fizetesHonap % 12,
			8,
			0, 0, 0
		);


		/* Eddig megkeresett pénz */

		const eddigOrak =
			ledolgozottOrak(honapKezdete, most);

		const eddigOsszeg =
			eddigOrak * ORABER;

		document.getElementById("fizu-osszeg")
			.textContent = formatFt(eddigOsszeg);


		/* Teljes havi várható fizetés */

		const haviOrak =
			ledolgozottOrak(
				honapKezdete,
				honapVege
			);

		const haviOsszeg =
			haviOrak * ORABER;

		document.getElementById("fizu-varhato")
			.textContent =
				"💰 Várható fizetés 8-án: ~" +
				formatFt(haviOsszeg) +
				" (" + haviOrak + " óra)";


		/* Progress bar */

		const progress =
			haviOsszeg > 0
				? Math.min(
					(eddigOsszeg / haviOsszeg) * 100,
					100
				)
				: 0;

		document.getElementById("progress-bar")
			.style.width = progress + "%";


		/* Aktuális műszak állapota */

		const tipus = muszakTipus(most);

		let statusSzoveg;


		if (tipus === "szabad") {

			statusSzoveg =
				"😴 Ma szabadnap van, a számláló most nem nő.";

		} else {

			const intervallum =
				muszakIdointervallum(most);

			const [ms, me] = intervallum;

			if (most >= ms && most <= me) {

				statusSzoveg =
					(
						tipus === "nappal"
							? "🌞 Nappalos műszak"
							: "🌙 Éjszakás műszak"
					) +
					" – megy a számláló!";

			} else {

				statusSzoveg =
					"⏸️ Most nincs műszak, a számláló szünetel.";
			}
		}


		document.getElementById("fizu-status")
			.textContent = statusSzoveg;


		/* Napok a következő fizetésig */

		const napokAFizuig =
			Math.ceil(
				(kovetkezo - most) / 86400000
			);


		/* Alsó információs sor */

		document.getElementById("fizu-info")
			.textContent =
				"Időszak: " +
				formatDatum(honapKezdete) +
				" – " +
				formatDatum(honapVege) +
				" · Következő fizetés: " +
				formatDatum(kovetkezo) +
				" (" +
				napokAFizuig +
				" nap múlva)";
	}


	/* =========================
	   MŰSZAKNAPTÁR
	   ========================= */

	function generalMuszakNaptar() {

		const most = new Date();

		const ev = most.getFullYear();
		const honap = most.getMonth();


		const honapNeve =
			new Intl.DateTimeFormat("hu-HU", {
				month: "long"
			}).format(
				new Date(ev, honap, 1)
			);


		const napokSzama =
			new Date(
				ev,
				honap + 1,
				0
			).getDate();


		const elsoNap =
			new Date(
				ev,
				honap,
				1
			).getDay();


		/* Hétfő legyen az első nap */

		const eltolodas =
			(elsoNap + 6) % 7;


		let html = `

			<div class="naptar-cim">

				${honapNeve.charAt(0).toUpperCase() +
				honapNeve.slice(1)}
				${ev}

			</div>

			<div class="naptar-fejlec">

				<div>H</div>
				<div>K</div>
				<div>Sze</div>
				<div>Cs</div>
				<div>P</div>
				<div>Szo</div>
				<div>V</div>

			</div>

			<div class="naptar-napok">

		`;


		/* Üres mezők a hónap elején */

		for (
			let i = 0;
			i < eltolodas;
			i++
		) {

			html +=
				`<div class="nap nap-ures"></div>`;
		}


		/* Napok */

		for (
			let nap = 1;
			nap <= napokSzama;
			nap++
		) {

			const datum =
				new Date(
					ev,
					honap,
					nap
				);

			const tipus =
				muszakTipus(datum);


			let osztaly = "nap ";
			let jel = "";


			if (tipus === "nappal") {

				osztaly += "nap-nappal";
				jel = "🌞";

			} else if (tipus === "ejszaka") {

				osztaly += "nap-ejszaka";
				jel = "🌙";

			} else {

				osztaly += "nap-szabad";
				jel = "😴";
			}


			/* Mai nap kiemelése */

			const ma =
				nap === most.getDate() &&
				honap === most.getMonth() &&
				ev === most.getFullYear();


			if (ma) {
				osztaly += " nap-ma";
			}


			html += `

				<div class="${osztaly}">

					<div class="nap-jel">
						${jel}
					</div>

					<div class="nap-szam">
						${nap}
					</div>

				</div>

			`;
		}


		html += `</div>`;


		document.getElementById(
			"muszak-naptar"
		).innerHTML = html;
	}


	/* =========================
	   INDÍTÁS
	   ========================= */

	frissitFizumat();

	generalMuszakNaptar();

	setInterval(
		frissitFizumat,
		1000
	);

</script>

</body>
</html>
